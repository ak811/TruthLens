# TruthLens main configuration: Chat-UniVi probing + LLM verdict (Tables 1-3, Table 2 best row).
# Follows the paper where it is explicit (9 probes, GPT-4 judge) and the released
# code where the paper is silent (LVLM decoding). See docs/AUDIT.md.
run_name: chatunivi_gpt4
output_dir: outputs/chatunivi_gpt4
seed: 0

data:
  manifest: data/manifest.jsonl   # built with `truthlens manifest` (docs/DATA.md)
  subsets: []                      # [] = all subsets (real, ldm, progan)

probe:
  backend: chatunivi
  model_path: Chat-UniVi/Chat-UniVi
  device: cuda
  categories: all                  # the 9 probes of Appendix B
  options:
    conv_mode: simple              # as in the released script
  generation:                      # released-script decoding (not reported in the paper)
    do_sample: true
    temperature: 0.2
    top_p: null
    num_beams: 1
    max_new_tokens: 1024

aggregate:
  mode: structured                 # use `pipe` to reproduce concatinate_jsons.py exactly
  categories: all
  on_missing: warn

judge:
  backend: openai
  model: gpt-4                     # paper: GPT-4 (snapshot not reported); released code: gpt-3.5-turbo
  prompt: truthlens_v1             # released system prompt, verbatim
  temperature: null                # API default, as in the released code
  seed: null

evaluate:
  invalid_policy: incorrect
